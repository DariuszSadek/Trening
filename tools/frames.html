<!doctype html><html><head><meta charset="utf-8">
<style>
body{margin:0;background:#fff;font:14px Baskerville,Georgia,serif}
.f{display:inline-flex;align-items:center;gap:6px;padding:6px;background:#fff;margin:4px}
.f svg{width:250px;height:188px;border:1px solid #ddd;border-radius:8px;background:#faf9f6}
.f .ar{font-size:28px;color:#1f3b5f}
.f .cap{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:#555}
</style></head><body><div id="g"></div>
<script type="module">
import { svgString, INLINE_CSS } from '../js/figure.js';
import { FIG } from '../js/figs.js';
const st=document.createElement('style');st.textContent=INLINE_CSS;document.head.appendChild(st);
const ids=(new URLSearchParams(location.search).get('ids')||'').split(',');
const g=document.getElementById('g');
for(const id of ids){
  const spec=FIG[id]; if(!spec) continue;
  const d=document.createElement('div'); d.className='f'; d.id='f-'+id;
  const n=spec.poses.length;
  const still = id==='plank';
  const frames = still ? [0] : (n>2 ? [0,1,2] : [0,1]);
  d.innerHTML = frames.map((i,k)=>`<div class="cap">${svgString(spec,null,{frame:i})}<span>${still?'pozycja':(k===0?'start':(k===frames.length-1?'koniec':'faza '+(k+1)))}</span></div>`).join('<span class="ar">→</span>');
  g.appendChild(d);
}
document.title='ok';
</script></body></html>
